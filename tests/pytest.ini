[pytest]
# Located inside tests/ on purpose: the test configuration lives with the tests.
# Invoke with `python -m pytest tests` from the project root so pytest picks this
# file up. A bare `pytest` from the root does not read config files in subdirectories.
testpaths = .
addopts = -ra --strict-markers --strict-config
filterwarnings =
    error::starlette.exceptions.StarletteDeprecationWarning
