name: tests

# Runs the fast test job on every branch push; full CI (lint, format, audit,
# Python 3.11 + 3.15 matrix) runs on pull requests via ci.yml, so a second
# pull_request trigger here would duplicate those runs.
on:
  push:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: python -m pytest -q tests
